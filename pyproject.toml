[project]
name = "kla"
version = "0.1.0"
description = "Kalman Linear Attention (KLA): a linear-attention layer that runs an exact parallel Kalman filter, propagating uncertainty through a non-linear recurrence to give explicit per-channel uncertainty alongside every output."
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"
# uv_build does NOT bundle LICENSE automatically — without this the wheel ships
# `License-Expression: MIT` and no license text.
license-files = ["LICENSE"]
authors = [
    { name = "Vaisakh Shaj", email = "vaisakhs.shaj@gmail.com" },
    { name = "Cameron Barker", email = "cameronbarkeran@gmail.com" },
    { name = "Aidan Scannell", email = "aidan.scannell@ed.ac.uk" },
    { name = "Andras Szecsenyi", email = "andras.szecsenyi@gmail.com" },
]
keywords = [
    "machine learning",
    "attention",
    "neural networks",
    "pytorch",
    "llm",
    "ssm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.8",
    "numpy>=1.26",
    "tyro>=1.0.13",
    "setuptools>=84.0.0",
    "ninja>=1.11"
]

[project.urls]
Homepage = "https://github.com/vaisakh-shaj/kalman-linear-attention"
Repository = "https://github.com/vaisakh-shaj/kalman-linear-attention"
Issues = "https://github.com/vaisakh-shaj/kalman-linear-attention/issues"
Paper = "https://arxiv.org/abs/2602.10743"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16", "pre-commit>=4"]
cu126 = ["torch>=2.8; sys_platform == 'linux'"]
cu130 = ["torch>=2.8; sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: finite-difference gradchecks; deselect with -m 'not slow'"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ group = "cu126" }, { group = "cu130" }]]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", group = "cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", group = "cu130", marker = "sys_platform == 'linux'" },
]
